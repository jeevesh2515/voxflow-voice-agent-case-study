<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FBBF24" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171" />
    </marker>
  </defs>

  <!-- Container Canvas -->
  <rect x="2" y="2" width="956" height="386" rx="12" fill="#0B132B" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="956" height="5" rx="2" fill="url(#headerGrad)" />

  <!-- Header Section -->
  <g transform="translate(24, 30)">
    <circle cx="10" cy="10" r="10" fill="#0284C7" />
    <path d="M 6 10 L 9 13 L 14 7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">VoxFlow Failure Modes &amp; Escalation Architecture</text>
    <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Fail-Closed Safety: Turn Deadlines, Tool Timeouts, Schema Rejections &amp; Callback Queuing</text>
  </g>

  <!-- Node: Caller Turn Inbound -->
  <g>
    <rect x="30" y="80" width="215" height="68" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    
    <rect x="180" y="87" width="55" height="16" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="207.5" y="98.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">TURN</text>
    <text x="44" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Caller Turn Inbound</text>
    <text x="44" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Transcript received from bridge</tspan><tspan x="44" dy="14">Turn timer starts (0 ms)</tspan></text>
  </g>
  <!-- Node: Turn Deadline Guard -->
  <g>
    <rect x="30" y="175" width="215" height="72" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="165" y="182" width="70" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="200.0" y="193.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F59E0B" text-anchor="middle">SLA 6.0s</text>
    <text x="44" y="197" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Turn Deadline Guard</text>
    <text x="44" y="215" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Strict 6.0s hard deadline</tspan><tspan x="44" dy="14">Fail closed if delayed</tspan></text>
  </g>
  <!-- Node: Tool Dispatch -->
  <g>
    <rect x="30" y="275" width="215" height="68" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.6" />
    
    <rect x="179" y="282" width="56" height="16" rx="8" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
    <text x="207.0" y="293.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#818CF8" text-anchor="middle">RUNNER</text>
    <text x="44" y="297" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Tool Dispatch</text>
    <text x="44" y="315" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Execute query or mutation</tspan><tspan x="44" dy="14">Monitor runtime health</tspan></text>
  </g>
  <!-- Group: FAILURE MODE CLASSIFIERS -->
  <rect x="275" y="70" width="345" height="300" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="3,3" />
  <text x="289" y="88" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#F87171" letter-spacing="0.5">FAILURE MODE CLASSIFIERS</text>

  <!-- Node: Tool Timeout / Network Failure -->
  <g>
    <rect x="290" y="95" width="315" height="54" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="1.6" />
    
    <rect x="532" y="102" width="63" height="16" rx="8" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1" />
    <text x="563.5" y="113.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F87171" text-anchor="middle">TIMEOUT</text>
    <text x="304" y="114" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Tool Timeout / Network Failure</text>
    <text x="304" y="130" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">No record received within window</tspan></text>
  </g>
  <!-- Node: Malformed / Missing Record -->
  <g>
    <rect x="290" y="162" width="315" height="54" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="1.6" />
    
    <rect x="539" y="169" width="56" height="16" rx="8" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1" />
    <text x="567.0" y="180.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F87171" text-anchor="middle">SCHEMA</text>
    <text x="304" y="181" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Malformed / Missing Record</text>
    <text x="304" y="197" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">Result missing required fact fields</tspan></text>
  </g>
  <!-- Node: Prompt Injection Detected -->
  <g>
    <rect x="290" y="228" width="315" height="54" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="518" y="235" width="77" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="556.5" y="246.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F59E0B" text-anchor="middle">INJECTION</text>
    <text x="304" y="247" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Prompt Injection Detected</text>
    <text x="304" y="263" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">Instruction text in speech / sheet</tspan></text>
  </g>
  <!-- Node: Authentication Lockout -->
  <g>
    <rect x="290" y="295" width="315" height="60" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.6" />
    
    <rect x="532" y="302" width="63" height="16" rx="8" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1" />
    <text x="563.5" y="313.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F43F5E" text-anchor="middle">LOCKOUT</text>
    <text x="304" y="317" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Authentication Lockout</text>
    <text x="304" y="335" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">2 failed factors or 2 wrong PINs</tspan></text>
  </g>
  <!-- Node: Fixed Escalation Script -->
  <g>
    <rect x="650" y="95" width="280" height="78" rx="8" fill="#1E293B" stroke="#F87171" stroke-width="1.6" />
    
    <rect x="815" y="102" width="105" height="16" rx="8" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1" />
    <text x="867.5" y="113.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F87171" text-anchor="middle">HONEST SCRIPT</text>
    <text x="664" y="117" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Fixed Escalation Script</text>
    <text x="664" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="664" dy="0">&quot;I can&#x27;t confirm that from live records right now. I&#x27;ve raised it with our ops team.&quot;</tspan></text>
  </g>
  <!-- Node: Human Callback Ticket -->
  <g>
    <rect x="650" y="195" width="280" height="68" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="864" y="202" width="56" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="892.0" y="213.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F59E0B" text-anchor="middle">TICKET</text>
    <text x="664" y="217" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Human Callback Ticket</text>
    <text x="664" y="235" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="664" dy="0">Enqueue callback ticket in Postgres</tspan><tspan x="664" dy="14">Include call summary &amp; reason</tspan></text>
  </g>
  <!-- Node: Graceful Call Closure -->
  <g>
    <rect x="650" y="285" width="280" height="68" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="843" y="292" width="77" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="881.5" y="303.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">SAFE EXIT</text>
    <text x="664" y="307" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Graceful Call Closure</text>
    <text x="664" y="325" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="664" dy="0">Safe termination of voice turn</tspan><tspan x="664" dy="14">Zero hallucinated status spoken</tspan></text>
  </g>
  <path d="M 137 148 L 137 175" stroke="#38BDF8" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
  
    <rect x="112.0" y="152.5" width="50" height="18" rx="5" fill="#0B132B" stroke="#38BDF8" stroke-width="0.9" />
    <text x="137.0" y="164.5" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Active</text>
  <path d="M 137 247 L 137 275" stroke="#10B981" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
  
    <rect x="112.0" y="252.0" width="50" height="18" rx="5" fill="#0B132B" stroke="#10B981" stroke-width="0.9" />
    <text x="137.0" y="264.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">&lt; 6.0s</text>
  <path d="M 245 211 C 450 211, 450 134, 650 134" stroke="#F43F5E" stroke-width="1.6" fill="none" marker-end="url(#arrowRose)" />
  
    <rect x="386.0" y="163" width="128" height="18" rx="5" fill="#0B132B" stroke="#F43F5E" stroke-width="0.9" />
    <text x="450" y="175" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">&gt; 6.0s SLA Exceeded</text>
  <path d="M 245 309 L 290 122" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#arrowRose)" />
  
    <rect x="239.5" y="206.5" width="56" height="18" rx="5" fill="#0B132B" stroke="#F87171" stroke-width="0.9" />
    <text x="267.5" y="218.5" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Timeout</text>
  <path d="M 245 309 L 290 189" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#arrowRose)" />
  
    <rect x="239.5" y="240.0" width="56" height="18" rx="5" fill="#0B132B" stroke="#F87171" stroke-width="0.9" />
    <text x="267.5" y="252.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Invalid</text>
  <path d="M 245 309 L 290 255" stroke="#F59E0B" stroke-width="1.6" fill="none" marker-end="url(#arrowAmber)" />
  
    <rect x="239.5" y="273.0" width="56" height="18" rx="5" fill="#0B132B" stroke="#F59E0B" stroke-width="0.9" />
    <text x="267.5" y="285.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Flagged</text>
  <path d="M 245 309 L 290 325" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#arrowRose)" />
  
    <rect x="236.5" y="308.0" width="62" height="18" rx="5" fill="#0B132B" stroke="#F87171" stroke-width="0.9" />
    <text x="267.5" y="320.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Exceeded</text>
  <path d="M 605 122 L 650 134" stroke="#F87171" stroke-width="1.6" fill="none" marker-end="url(#arrowRose)" />
  
    <rect x="602.5" y="119.0" width="50" height="18" rx="5" fill="#0B132B" stroke="#F87171" stroke-width="0.9" />
    <text x="627.5" y="131.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Script</text>
  <path d="M 790 173 L 790 195" stroke="#F59E0B" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
  
    <rect x="756.0" y="175.0" width="68" height="18" rx="5" fill="#0B132B" stroke="#F59E0B" stroke-width="0.9" />
    <text x="790.0" y="187.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Log Event</text>
  <path d="M 790 263 L 790 285" stroke="#10B981" stroke-width="1.6" fill="none" marker-end="url(#arrow)" />
  
    <rect x="759.0" y="265.0" width="62" height="18" rx="5" fill="#0B132B" stroke="#10B981" stroke-width="0.9" />
    <text x="790.0" y="277.0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F8FAFC" text-anchor="middle">Finalize</text></svg>