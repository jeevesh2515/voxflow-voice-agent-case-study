  </g>
  <!-- Group: Failure Mode Classifiers -->
  <rect x="300" y="95" width="340" height="365" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="1.2" stroke-dasharray="4,4" />
  <text x="316" y="115" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#F87171" letter-spacing="0.5">FAILURE MODE CLASSIFIERS</text>

  <!-- Node: Tool Timeout / Network Failure -->
  <g filter="url(#shadow)">
    <rect x="320" y="125" width="300" height="65" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.8" />
    
    <rect x="545" y="133" width="65" height="18" rx="9" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1" />
