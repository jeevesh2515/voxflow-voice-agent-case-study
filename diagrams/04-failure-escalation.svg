<svg width="100%" height="100%" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FBBF24" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171" />
    </marker>
  </defs>

  <!-- Container Canvas -->
  <rect x="2" y="2" width="956" height="476" rx="14" fill="#0B132B" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="956" height="6" rx="3" fill="url(#headerGrad)" />

  <!-- Header Section -->
  <g transform="translate(30, 36)">
    <circle cx="12" cy="12" r="12" fill="#0284C7" />
    <path d="M 7 12 L 11 16 L 17 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="34" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">VoxFlow Failure Modes & Escalation Architecture</text>
    <text x="34" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Fail-Closed Safety: Turn Deadlines, Tool Timeouts, Schema Rejections & Callback Queuing</text>
  </g>

  <!-- Node: Caller Turn Inbound -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="220" height="75" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" />
    
    <rect x="185" y="128" width="65" height="18" rx="9" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="217.5" y="140" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">TURN</text>
    <text x="56" y="144" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Caller Turn Inbound</text>
    <text x="56" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Transcript received from bridge
Turn timer starts (0 ms)</text>
  </g>
  <!-- Node: Turn Deadline Guard -->
  <g filter="url(#shadow)">
    <rect x="40" y="250" width="220" height="80" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
    <rect x="185" y="258" width="65" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="217.5" y="270" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">SLA 6.0s</text>
    <text x="56" y="274" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Turn Deadline Guard</text>
    <text x="56" y="294" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Strict 6.0s hard deadline
Fail closed if delayed</text>
  </g>
  <!-- Node: Tool Dispatch -->
  <g filter="url(#shadow)">
    <rect x="40" y="380" width="220" height="70" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.8" />
    
    <rect x="185" y="388" width="65" height="18" rx="9" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
    <text x="217.5" y="400" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#818CF8" text-anchor="middle">RUNNER</text>
    <text x="56" y="404" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Tool Dispatch</text>
    <text x="56" y="424" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Execute query or mutation
