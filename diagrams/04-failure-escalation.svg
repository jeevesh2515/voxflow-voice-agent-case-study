  <!-- Node: Fixed Escalation Script -->
  <g filter="url(#shadow)">
    <rect x="680" y="140" width="240" height="90" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.8" />
    
    <rect x="845" y="148" width="65" height="18" rx="9" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1" />
