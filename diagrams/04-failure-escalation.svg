    <rect x="845" y="378" width="65" height="18" rx="9" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="877.5" y="390" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">SAFE EXIT</text>
    <text x="696" y="394" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Graceful Call Closure</text>
    <text x="696" y="414" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Safe termination of voice turn
Zero hallucinated status spoken</text>
  </g>
