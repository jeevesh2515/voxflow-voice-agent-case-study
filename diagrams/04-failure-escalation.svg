    <text x="336" y="149" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Tool Timeout / Network Failure</text>
    <text x="336" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">No record received within turn window</text>
  </g>
  <!-- Node: Malformed / Missing Record -->
  <g filter="url(#shadow)">
    <rect x="320" y="205" width="300" height="65" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.8" />
    
