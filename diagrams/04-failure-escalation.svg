  <!-- Node: Adversarial Injection Detected -->
  <g filter="url(#shadow)">
    <rect x="320" y="285" width="300" height="65" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
    <rect x="545" y="293" width="65" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="577.5" y="305" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">INJECTION</text>
    <text x="336" y="309" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Adversarial Injection Detected</text>
    <text x="336" y="329" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Instruction text in speech or sheet data</text>
  </g>
  <!-- Node: Authentication / PIN Lockout -->
  <g filter="url(#shadow)">
    <rect x="320" y="365" width="300" height="75" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="1.8" />
    
