<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34D399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FBBF24" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171" />
    </marker>
  </defs>

  <!-- Container Canvas -->
  <rect x="2" y="2" width="956" height="416" rx="12" fill="#0B132B" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="956" height="5" rx="2" fill="url(#headerGrad)" />

  <!-- Header Section -->
  <g transform="translate(24, 30)">
    <circle cx="10" cy="10" r="10" fill="#0284C7" />
    <path d="M 6 10 L 9 13 L 14 7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">VoxFlow Voice Call State Machine</text>
    <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Multi-Factor Identity, Deterministic Routing, Confirmation Gates &amp; Safe Escalation</text>
  </g>

  <!-- Node: 1. Inbound Call -->
  <g>
    <rect x="30" y="80" width="205" height="74" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    
    <rect x="170" y="87" width="55" height="16" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="197.5" y="98.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">INIT</text>
    <text x="44" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">1. Inbound Call</text>
    <text x="44" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">DID exact routing</tspan><tspan x="44" dy="14">Recording disclosure</tspan></text>
  </g>
  <!-- Node: 2. Caller 2FA Identity -->
  <g>
    <rect x="265" y="80" width="205" height="74" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.6" />
    
    <rect x="405" y="87" width="55" height="16" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
    <text x="432.5" y="98.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#0284C7" text-anchor="middle">2FA</text>
    <text x="279" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">2. Caller 2FA Identity</text>
    <text x="279" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="279" dy="0">Account + 1 factor</tspan><tspan x="279" dy="14">Max 2 attempts limit</tspan></text>
  </g>
  <!-- Node: 3. Intent Routing -->
  <g>
    <rect x="500" y="80" width="205" height="74" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.6" />
    
    <rect x="639" y="87" width="56" height="16" rx="8" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
    <text x="667.0" y="98.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#818CF8" text-anchor="middle">ROUTER</text>
    <text x="514" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">3. Intent Routing</text>
    <text x="514" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="514" dy="0">Slot &amp; reference parse</tspan><tspan x="514" dy="14">Bounded tool surface</tspan></text>
  </g>
  <!-- Node: 4. Policy Gate -->
  <g>
    <rect x="735" y="80" width="195" height="74" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="865" y="87" width="55" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
