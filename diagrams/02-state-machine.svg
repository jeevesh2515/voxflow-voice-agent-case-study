  <!-- Node: Grounded Spoken Output -->
  <g>
    <rect x="30" y="325" width="270" height="72" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="227" y="332" width="63" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="258.5" y="343.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">SUCCESS</text>
