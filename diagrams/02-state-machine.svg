    <text x="56" y="284" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">High-Impact PIN Gate</text>
    <text x="56" y="304" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">4-8 digit caller PIN
PBKDF2-HMAC-SHA256</text>
