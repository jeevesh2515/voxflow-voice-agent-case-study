    <text x="344" y="347" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Safe Call Closure</text>
    <text x="344" y="365" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="344" dy="0">Zero-lost-turn state committed</tspan><tspan x="344" dy="14">Summary written to tenant sheet</tspan></text>
  </g>
  <!-- Node: Deterministic Escalation -->
