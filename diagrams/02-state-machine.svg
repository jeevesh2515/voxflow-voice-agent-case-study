    <text x="44" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">4-8 digit caller PIN</tspan><tspan x="44" dy="14">PBKDF2-HMAC-SHA256</tspan></text>
  </g>
  <!-- Node: Confirmation Gate -->
  <g>
    <rect x="275" y="205" width="225" height="74" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="427" y="212" width="63" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
