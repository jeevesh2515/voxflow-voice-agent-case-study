  </g>
  <!-- Node: Safe Call Closure -->
  <g>
    <rect x="330" y="325" width="270" height="72" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.6" />
    
    <rect x="535" y="332" width="55" height="16" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
