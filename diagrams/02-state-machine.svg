    <text x="289" y="227" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Confirmation Gate</text>
    <text x="289" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="289" dy="0">Explicit verbal yes</tspan><tspan x="289" dy="14">Bound to args hash</tspan></text>
  </g>
  <!-- Node: Tool Execution -->
  <g>
    <rect x="530" y="205" width="225" height="74" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="690" y="212" width="55" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
