    <text x="749" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">4. Policy Gate</text>
    <text x="749" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="749" dy="0">Read: Authorized</tspan><tspan x="749" dy="14">Write: Gate required</tspan></text>
  </g>
  <!-- Node: High-Impact PIN Gate -->
  <g>
    <rect x="30" y="205" width="215" height="74" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="180" y="212" width="55" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
