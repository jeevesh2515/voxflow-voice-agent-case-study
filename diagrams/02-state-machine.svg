    <text x="376" y="444" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">6B. Graceful Escalation</text>
    <text x="376" y="464" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Fixed escalation script
Never invent status or ETAs</text>
