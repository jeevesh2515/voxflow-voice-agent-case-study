    <text x="476" y="124" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">3. Intent Detection</text>
    <text x="476" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Slot & reference extraction
