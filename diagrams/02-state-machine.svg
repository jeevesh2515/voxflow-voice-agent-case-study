    <text x="256" y="124" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">2. Identity Verification</text>
    <text x="256" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Account + 1 factor
Max 2 attempts</text>
  </g>
  <!-- Node: 3. Intent Detection -->
  <g filter="url(#shadow)">
    <rect x="460" y="100" width="180" height="80" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.8" />
    
    <rect x="565" y="108" width="65" height="18" rx="9" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
