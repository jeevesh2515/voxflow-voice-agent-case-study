  <!-- Node: 4. Policy & Security Gate -->
  <g filter="url(#shadow)">
    <rect x="680" y="100" width="240" height="80" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
    <rect x="845" y="108" width="65" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
