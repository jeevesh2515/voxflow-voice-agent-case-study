    <path d="M 7 12 L 11 16 L 17 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="34" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">VoxFlow Voice Call State Machine</text>
    <text x="34" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Multi-Factor Identity, Deterministic Routing, Confirmation Gates & Safe Escalation</text>
  </g>

  <!-- Node: 1. Inbound Call -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="160" height="80" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" />
    
    <rect x="125" y="108" width="65" height="18" rx="9" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="157.5" y="120" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">INIT</text>
    <text x="56" y="124" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">1. Inbound Call</text>
    <text x="56" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">DID Routing
Recording notice</text>
  </g>
  <!-- Node: 2. Identity Verification -->
  <g filter="url(#shadow)">
    <rect x="240" y="100" width="180" height="80" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.8" />
    
    <rect x="345" y="108" width="65" height="18" rx="9" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
