    <text x="799" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="799" dy="0">Deduplicate key</tspan><tspan x="799" dy="14">Replay on match</tspan></text>
