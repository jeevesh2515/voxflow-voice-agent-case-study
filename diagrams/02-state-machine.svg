    <text x="696" y="124" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">4. Policy & Security Gate</text>
    <text x="696" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Read: Authorized
Write: Confirmation / PIN</text>
  </g>
  <!-- Node: High-Impact PIN Gate -->
  <g filter="url(#shadow)">
    <rect x="40" y="260" width="240" height="80" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
