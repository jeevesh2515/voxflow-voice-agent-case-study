    <text x="336" y="174" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">check_stock · get_order_status
Requires verified session identity</text>
  </g>
  <!-- Node: Tier 2: Reversible Writes -->
  <g filter="url(#shadow)">
    <rect x="320" y="215" width="300" height="75" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" />
    
