  <g filter="url(#shadow)">
    <rect x="680" y="370" width="240" height="85" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
    
    <rect x="845" y="378" width="65" height="18" rx="9" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
