    <text x="336" y="259" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">book_delivery_slot · update_status
Requires explicit yes + arg hash match</text>
  </g>
  <!-- Node: Tier 3: High-Impact Writes -->
  <g filter="url(#shadow)">
    <rect x="320" y="310" width="300" height="80" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
