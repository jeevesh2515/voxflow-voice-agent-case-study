    <text x="56" y="144" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">1. Caller Speech</text>
    <text x="56" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Untrusted spoken audio
Transcript extraction</text>
  </g>
  <!-- Node: 2. Schema Validator -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="220" height="70" rx="10" fill="#1E293B" stroke="#0284C7" stroke-width="1.8" />
    
    <rect x="185" y="238" width="65" height="18" rx="9" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
