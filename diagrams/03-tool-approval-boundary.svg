  <!-- Node: Tier 1: Read-Only Tools -->
  <g filter="url(#shadow)">
    <rect x="320" y="130" width="300" height="65" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
    
    <rect x="545" y="138" width="65" height="18" rx="9" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
