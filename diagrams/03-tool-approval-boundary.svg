  <!-- Node: Tier 1: Read-Only Tools -->
  <g>
    <rect x="290" y="95" width="330" height="58" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="555" y="102" width="55" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="582.5" y="113.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">READ</text>
    <text x="304" y="117" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Tier 1: Read-Only Tools</text>
    <text x="304" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">check_stock · get_order_status</tspan></text>
  </g>
  <!-- Node: Tier 2: Reversible Writes -->
  <g>
    <rect x="290" y="168" width="330" height="68" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    
    <rect x="547" y="175" width="63" height="16" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="578.5" y="186.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">CONFIRM</text>
    <text x="304" y="190" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Tier 2: Reversible Writes</text>
    <text x="304" y="208" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">book_delivery_slot · update_status</tspan><tspan x="304" dy="14">Requires explicit yes + arg hash match</tspan></text>
  </g>
  <!-- Node: Tier 3: High-Impact Writes -->
  <g>
    <rect x="290" y="250" width="330" height="72" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="519" y="257" width="91" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="564.5" y="268.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#F59E0B" text-anchor="middle">PIN+CONFIRM</text>
    <text x="304" y="272" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Tier 3: High-Impact Writes</text>
    <text x="304" y="290" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">create_po · update_critical_record</tspan><tspan x="304" dy="14">Requires PBKDF2 PIN + Confirmation</tspan></text>
  </g>
  <!-- Node: Tier 4: Prohibited Actions -->
  <g>
    <rect x="290" y="334" width="330" height="56" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.6" />
    
    <rect x="547" y="341" width="63" height="16" rx="8" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1" />
