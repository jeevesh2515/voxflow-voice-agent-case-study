    <text x="696" y="284" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">5. Scoped DB Execution</text>
    <text x="696" y="304" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Explicit tenant_id filter
Atomic transaction commit</text>
  </g>
