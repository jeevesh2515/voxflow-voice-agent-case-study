    <text x="679" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="679" dy="0">Deduplicate repeated requests</tspan><tspan x="679" dy="14">Return cached result on hit</tspan></text>
  </g>
  <!-- Node: 5. Scoped DB Execution -->
  <g>
    <rect x="665" y="195" width="265" height="68" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="865" y="202" width="55" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="892.5" y="213.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">EXEC</text>
    <text x="679" y="217" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">5. Scoped DB Execution</text>
    <text x="679" y="235" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="679" dy="0">Explicit tenant_id filter</tspan><tspan x="679" dy="14">Atomic transaction commit</tspan></text>
  </g>
  <!-- Node: 6. Spoken Fact Grounding -->
  <g>
    <rect x="665" y="295" width="265" height="78" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.6" />
    
    <rect x="850" y="302" width="70" height="16" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="885.0" y="313.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" text-anchor="middle">GROUNDED</text>
    <text x="679" y="317" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">6. Spoken Fact Grounding</text>
    <text x="679" y="335" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="679" dy="0">Validate result payload schema</tspan><tspan x="679" dy="14">Speak allow-listed fields only</tspan></text>
  </g>
