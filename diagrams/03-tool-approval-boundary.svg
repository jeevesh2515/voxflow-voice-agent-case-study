    <text x="304" y="374" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="304" dy="0">issue_refund · arbitrary commands</tspan></text>
  </g>
  <!-- Node: 4. Idempotency Check -->
  <g>
    <rect x="665" y="95" width="265" height="68" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    
    <rect x="836" y="102" width="84" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
