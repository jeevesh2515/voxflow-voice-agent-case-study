    <text x="56" y="274" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Deterministic intent + args
Reject unexpected keys</text>
  </g>
  <!-- Node: 3. Identity Scoping -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="220" height="70" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.8" />
    
