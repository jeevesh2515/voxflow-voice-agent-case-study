    <text x="34" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Zero-Trust Execution: Schema Validation, Identity Scoping, Confirmation & Idempotency</text>
  </g>

  <!-- Node: 1. Caller Speech -->
