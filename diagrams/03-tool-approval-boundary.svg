    <text x="696" y="174" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">4. Idempotency Check</text>
    <text x="696" y="194" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Deduplicate repeated requests
Return cached result on hit</text>
  </g>
  <!-- Node: 5. Scoped DB Execution -->
  <g filter="url(#shadow)">
    <rect x="680" y="260" width="240" height="75" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.8" />
    
    <rect x="845" y="268" width="65" height="18" rx="9" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
