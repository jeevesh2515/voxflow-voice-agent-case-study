  <!-- Container Canvas -->
  <rect x="2" y="2" width="956" height="416" rx="12" fill="#0B132B" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="956" height="5" rx="2" fill="url(#headerGrad)" />

  <!-- Header Section -->
  <g transform="translate(24, 30)">
    <circle cx="10" cy="10" r="10" fill="#0284C7" />
    <path d="M 6 10 L 9 13 L 14 7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">VoxFlow Tool Authorization &amp; Approval Boundary</text>
    <text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Zero-Trust Execution: Schema Validation, Identity Scoping, Confirmation &amp; Idempotency</text>
  </g>

  <!-- Node: 1. Caller Speech -->
  <g>
    <rect x="30" y="80" width="215" height="66" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    
    <rect x="180" y="87" width="55" height="16" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="207.5" y="98.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#38BDF8" text-anchor="middle">INPUT</text>
    <text x="44" y="102" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">1. Caller Speech</text>
    <text x="44" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Untrusted spoken audio</tspan><tspan x="44" dy="14">Transcript extraction</tspan></text>
  </g>
  <!-- Node: 2. Schema Validator -->
  <g>
    <rect x="30" y="175" width="215" height="66" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.6" />
    
    <rect x="165" y="182" width="70" height="16" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1" />
    <text x="200.0" y="193.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#0284C7" text-anchor="middle">VALIDATE</text>
    <text x="44" y="197" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">2. Schema Validator</text>
    <text x="44" y="215" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Deterministic intent + args</tspan><tspan x="44" dy="14">Reject unexpected keys</tspan></text>
  </g>
  <!-- Node: 3. Identity Scoping -->
  <g>
    <rect x="30" y="270" width="215" height="66" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.6" />
    
    <rect x="180" y="277" width="55" height="16" rx="8" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" />
    <text x="207.5" y="288.5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#818CF8" text-anchor="middle">AUTH</text>
    <text x="44" y="292" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">3. Identity Scoping</text>
    <text x="44" y="310" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8"><tspan x="44" dy="0">Check session factor binding</tspan><tspan x="44" dy="14">Exact supplier_id match</tspan></text>
  </g>
  <!-- Group: TOOL CLASSIFICATION &amp; APPROVAL GATES -->
