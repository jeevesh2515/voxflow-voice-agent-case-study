    <text x="336" y="334" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Tier 3: High-Impact Writes</text>
    <text x="336" y="354" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">create_po · update_critical_record
Requires PBKDF2 PIN + Confirmation</text>
  </g>
  <!-- Node: Tier 4: Prohibited Actions -->
  <g filter="url(#shadow)">
    <rect x="320" y="410" width="300" height="60" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="1.8" />
    
    <rect x="545" y="418" width="65" height="18" rx="9" fill="#F43F5E" fill-opacity="0.2" stroke="#F43F5E" stroke-width="1" />
    <text x="577.5" y="430" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F43F5E" text-anchor="middle">BLOCKED</text>
    <text x="336" y="434" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#F8FAFC">Tier 4: Prohibited Actions</text>
    <text x="336" y="454" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">issue_refund · arbitrary shell/code
Hard-blocked; never executed</text>
  </g>
  <!-- Node: 4. Idempotency Check -->
  <g filter="url(#shadow)">
    <rect x="680" y="150" width="240" height="75" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    
    <rect x="845" y="158" width="65" height="18" rx="9" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
